<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicaciones</title>
</head>

<body>
    <form id="form-publicacion">
        <input id="titulo" placeholder="Título" required>
        <span id="errorTitulo"></span>
        <textarea id="descripcion" placeholder="Descripción"></textarea>
        <input id="autor" placeholder="Nombre del autor" required>
        <span id="errorAutor"></span>
        <input id="email"  type="email" placeholder="Email" required> <small id="ayuda-email"></small>
        <select id="tipo">
            <option value="venta">Venta</option>
            <option value="servicio">Servicio</option>
        </select>
        <div id="campos-especificos"></div>
        <button>Publicar</button>
        <button id="botonActualizar">Actualizar</button>
        <span id="estadoActualizar"></span>
    
    </form>
    <output id="vista-previa"></output>
    <section id="lista-publicaciones"></section>
    <script type="module" src="js/main.js"></script>
</body>
</html>
